name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Add a fresh version tag to CSS and JS links
        run: |
          VERSION=$(git rev-parse --short HEAD)
          sed -i "s/style\.css/style.css?v=$VERSION/" index.html
          sed -i "s/script\.js/script.js?v=$VERSION/" index.html

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site as a build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4